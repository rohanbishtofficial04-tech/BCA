<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>

<body>
    <form action="demo.php" method="post" enctype="multipart/form-data">
        <label for="username">Username:</label>
        <input type="text" id="username" required minlength="5" maxlength="10" placeholder="John117"><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" required minlength="6" maxlength="15">

        <br><br><label for="email">E-mail:</label>
        <input type="email" id="email" required placeholder="john117@gmail.com">

        <br><br><label for="phone">Phone no:</label>
        <input type="tel" id="phone" required placeholder="91-1234567890" pattern="[0-9]{2}-[0-9]{10}">

        <br><br><label for="bday">Birthday:</label>
        <input type="date" id="bday" required>

        <br><br><label for="quantity">Quantity:</label>
        <input type="number" id="quantity" min="0" max="99" required>

        <br><br><label for="title">Title: </label>

        <label for="mr">Mr.</label>
        <input type="radio" id="mr" name="title">
        <label for="ms">Mrs.</label>
        <input type="radio" id="ms" name="title">
        <label for="phd">PhD.</label>
        <input type="radio" id="phd" name="title">

        <br><br><label for="payment">Payment:</label>
        <select id="payment">
            <option value="visa">Visa</option>
            <option value="master">MasterCard</option>
            <option value="gift">GiftCard</option>
        </select>

        <br><br><label for="agree">I Agree:</label>
        <input type="checkbox" id="agree"><br>

        <br><label for="comment">Comment: </label>
        <br><textarea id="comment" rows="3" cols="30"></textarea>

        <br><br><label for="file">File:</label>
        <input type="file" accept="image/png, image/jpeg">

        <br><br><input type="reset"><br>
        <input type="submit" style="margin-top: 0.5%;">
    </form>
</body>

</html>
