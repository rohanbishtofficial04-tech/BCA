<html lang="en">

<head>
    <title>TypesOfList</title>
</head>

<body>

    <h2><i>Unordered List</i></h2>
    <ul>
        <li>Item 1</li> <!--List Item-->
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4 <ul>
                <li>Item A</li> <!--List Inside List-->
                <li>Item B</li>
                <li>Item C</li>
            </ul>
        </li>
    </ul>
    <br>

    <h2><i> Ordered List</i></h2>
    <ol type="I">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
    </ol>
    <br>

    <h2><i>Description List</i></h2>
    <dl style="background-color: aqua; border: 2px solid;">
        <dt>HTML</dt> <!--Description Term-->
        <dd>HyperText Markup Language</dd> <!--Description Definition-->
        <br>
        <dt>CSS</dt>
        <dd>Cascading Style Sheets</dd>
    </dl>
</body>

</html>
