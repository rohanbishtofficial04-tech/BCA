<html lang="en">

<head>
    <title>Tables</title>
</head>

<body>
    <h1>Store Hours</h1>
    <hr>
    <table border="5" width="700">
        <tr bgcolor="grey"> <!--Table Row--> <!--1st Low-->
            <th width="100" height="50">Sunday</th> <!--Table Header-->
            <th width="100">Monday</th>
            <th width="100">Tuesday</th>
            <th width="100">Wednesday</th>
            <th width="100">Thursday</th>
            <th width="100">Friday</th>
            <th width="100">Saturday</th>
        </tr>

        <tr bgcolor="lightgrey" align="center"> <!--2nd Row-->
            <td>Closed</td> <!--Table Data-->
            <td>9-5</td>
            <td>9-5</td>
            <td>9-5</td>
            <td>9-5</td>
            <td>9-5</td>
            <td>Closed</td>
        </tr>
    </table>
</body>

</html>
