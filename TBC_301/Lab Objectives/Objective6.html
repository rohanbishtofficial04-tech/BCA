<html lang="en">

<head>

    <title>Table</title>

<body>

            <th colspan="7">Fashion wear</th>

            <td colspan="2">Men's wear</td>
            <td colspan="3">Women's wear</td>
            <td colspan="2">Kid's wear</td>
        </tr>
        <tr>
            <td>Pants</td>
            <td>Shirts</td>
            <td rowspan="2">Formal</td>
            <td>Shirts</td>
            <td rowspan="2">Ethnics</td>
            <td>Casuals</td>
            <td rowspan="2">Ethnics</td>
        </tr>
        <tr>
            <td>Jacket</td>
            <td>T-shirts</td>
            <td>Jeans</td>
            <td>Body care</td>
        </tr>
        <tr>
            <td colspan="5">E-Commerce source</td>
            <td colspan="2">Best Source</td>
        </tr>
        <tr>
            <td colspan="2">Amazon</td>
            <td rowspan="2">Myntra</td>
            <td rowspan="2" colspan="2">Flipkart</td>
            <td colspan="2">First Cry</td>
        </tr>
        <tr>

    </table>
</body>

</html>
