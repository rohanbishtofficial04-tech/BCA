<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICU Resource Management</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>ICU Resource Management</h1>
    <div class="controls">
      <button onclick="admitNewPatient()">Admit New Patient</button>
      <button onclick="requestResources()">Request Resources</button>
      <button onclick="dischargePatient()">Discharge Patient</button>
      <button onclick="viewStatus()">View System Status</button>
      <button onclick="checkSafeState()">Check Safe State</button>
      <button onclick="resetSystem()">Reset System</button>
    </div>
    <div class="output" id="output"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
